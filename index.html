<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splitly – split expenses with friends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4ef;--card:#fff;--ink:#14302c;--mute:#667a75;--line:#dde4df;--accent:#e8a317;--accent-ink:#2b1d00;--owe:#c2410c;--get:#15803d;--shadow:0 1px 2px rgba(20,48,44,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1b19;--card:#162826;--ink:#e6efec;--mute:#92a8a2;--line:#254039;--owe:#fb923c;--get:#4ade80;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;max-width:720px;margin:auto}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;cursor:pointer}
main{max-width:720px;margin:auto;padding:0 18px 80px}
h2{font-size:26px;margin:8px 0 4px;letter-spacing:-.5px}
h3{font-size:15px;margin:22px 0 8px;color:var(--mute);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.click{cursor:pointer}.row.click:hover{background:rgba(232,163,23,.08)}
.grow{flex:1;min-width:0}.sub{color:var(--mute);font-size:13px}
.amt{font-weight:600;white-space:nowrap}.owe{color:var(--owe)}.get{color:var(--get)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.av{width:32px;height:32px;border-radius:50%;background:var(--line);object-fit:cover;flex:none;display:grid;place-items:center;font-weight:600;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.hero{text-align:center;padding:70px 10px}
.hero h1{font-size:44px;line-height:1.05;letter-spacing:-1.5px;margin:0 0 14px}
.hero p{color:var(--mute);max-width:420px;margin:0 auto 26px}
.empty{padding:26px 16px;text-align:center;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(440px,92vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input[type=text],input[type=number],select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.chk{display:flex;align-items:center;gap:10px;padding:6px 0;color:var(--ink);font-size:15px;margin:0}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:9}
.err{background:var(--card);border:1px solid var(--owe);border-radius:14px;padding:18px;margin:20px 0}
#who2 .sa{display:none;width:110px}
#who2.byamt .sa{display:block}
#who2.byamt .cb{display:none}
code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:13px}
pre{background:var(--bg);padding:12px;border-radius:10px;overflow:auto;font-size:12px}
</style>
</head>
<body>
<header><span class="logo" id="logo">Splitly</span><span id="who"></span></header>
<main id="app"></main>
<dialog id="dlg"></dialog>

<script type="module">
/* ============ 1. PASTE YOUR FIREBASE CONFIG HERE ============
   Firebase console → Project settings → Your apps → Web app → SDK config */
const firebaseConfig = {
  apiKey: "AIzaSyB5paiSOzS1djoUEbym7_vh-rTb2rYYPCA",
  authDomain: "bucket-tracker-1d6cc.firebaseapp.com",
  databaseURL: "https://bucket-tracker-1d6cc-default-rtdb.firebaseio.com",
  projectId: "bucket-tracker-1d6cc",
  storageBucket: "bucket-tracker-1d6cc.firebasestorage.app",
  messagingSenderId: "699538557626",
  appId: "1:699538557626:web:d7fba33d82c879d9e79083"
};
/* ============================================================ */

import {initializeApp} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,updateDoc,deleteDoc,getDoc,onSnapshot,query,where,arrayUnion,serverTimestamp,setDoc,getDocs} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const $=s=>document.querySelector(s), app=$("#app"), dlg=$("#dlg");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const configured=!firebaseConfig.apiKey.startsWith("YOUR_");
let auth,db,user=null,groups=[],gid=null,group=null,expenses=[],unsubs=[];

function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2400)}
const money=c=>"₹"+(Math.abs(c)/100).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const avatar=m=>m?.photo?`<img class="av" src="${esc(m.photo)}" referrerpolicy="no-referrer" alt="">`:`<span class="av">${esc((m?.name||"?")[0])}</span>`;
const firstName=(g,u)=>u===user.uid?"You":(g.memberInfo?.[u]?.name||"Someone").split(" ")[0];

/* ---------- money logic (all in cents) ---------- */
function splitEqual(total,ids){const n=ids.length,base=Math.floor(total/n),extra=total-base*n,out={};ids.forEach((id,i)=>out[id]=base+(i<extra?1:0));return out}
function balances(){
  const b={};(group.members||[]).forEach(m=>b[m]=0);
  for(const e of expenses){
    if(e.type==="settle"){b[e.paidBy]=(b[e.paidBy]||0)+e.amount;b[e.to]=(b[e.to]||0)-e.amount;continue}
    b[e.paidBy]=(b[e.paidBy]||0)+e.amount;
    const sh=e.shares||splitEqual(e.amount,e.split);for(const u in sh)b[u]=(b[u]||0)-sh[u];
  }return b;
}
function simplify(b){
  const cr=[],de=[];for(const u in b){if(b[u]>0)cr.push([u,b[u]]);else if(b[u]<0)de.push([u,-b[u]])}
  cr.sort((a,c)=>c[1]-a[1]);de.sort((a,c)=>c[1]-a[1]);const out=[];let i=0,j=0;
  while(i<cr.length&&j<de.length){const x=Math.min(cr[i][1],de[j][1]);out.push({from:de[j][0],to:cr[i][0],amount:x});cr[i][1]-=x;de[j][1]-=x;if(!cr[i][1])i++;if(!de[j][1])j++}
  return out;
}

/* ---------- boot ---------- */
if(!configured){renderSetup()}else{
  const fb=initializeApp(firebaseConfig);auth=getAuth(fb);db=getFirestore(fb);
  onAuthStateChanged(auth,async u=>{
    user=u;
    $("#who").innerHTML=u?`<button class="btn sm" id="out">Sign out</button>`:"";
    if(u){$("#out").onclick=()=>signOut(auth);setDoc(doc(db,"users",u.uid),{name:u.displayName||u.email,email:u.email||"",emailLower:(u.email||"").toLowerCase(),photo:u.photoURL||""}).catch(()=>{});await handleJoinLink();listenGroups();route()}
    else{unsubs.forEach(f=>f());unsubs=[];groups=[];renderLogin()}
  });
}
$("#logo").onclick=()=>{if(user){gid=null;route()}};

async function handleJoinLink(){
  const id=new URLSearchParams(location.search).get("join");if(!id)return;
  history.replaceState({},"",location.pathname);
  try{
    const s=await getDoc(doc(db,"groups",id));
    if(!s.exists())return toast("That invite link is no longer valid");
    if(!s.data().members.includes(user.uid))
      await updateDoc(doc(db,"groups",id),{members:arrayUnion(user.uid),["memberInfo."+user.uid]:{name:user.displayName||user.email,photo:user.photoURL||"",email:user.email||""}});
    gid=id;toast("You joined "+s.data().name);
  }catch(e){toast("Could not join: "+e.message)}
}

function listenGroups(){
  unsubs.forEach(f=>f());
  unsubs=[onSnapshot(query(collection(db,"groups"),where("members","array-contains",user.uid)),s=>{
    groups=s.docs.map(d=>({id:d.id,...d.data()}));
    if(!gid)route();
  },e=>toast(e.message))];
}

let gUnsubs=[];
function route(){
  gUnsubs.forEach(f=>f());gUnsubs=[];
  if(!gid)return renderGroups();
  if(group?.id!==gid){group=null;expenses=[]}
  gUnsubs=[
    onSnapshot(doc(db,"groups",gid),s=>{group=s.exists()?{id:s.id,...s.data()}:null;renderGroup()}),
    onSnapshot(collection(db,"groups",gid,"expenses"),s=>{
      expenses=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.toMillis?.()??Date.now())-(a.createdAt?.toMillis?.()??Date.now()));
      renderGroup();
    })
  ];
}

/* ---------- views ---------- */
function renderLogin(){
  app.innerHTML=`<section class="hero"><h1>Split costs.<br>Keep the friendship.</h1><p>Create a group, add shared expenses, and see exactly who owes whom.</p><button class="btn pri" id="go">Continue with Google</button></section>`;
  $("#go").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>toast(e.message));
}

function renderGroups(){
  app.innerHTML=`<h2>Your groups</h2>
  <div class="bar"><button class="btn pri" id="new">New group</button></div>
  <div class="card">${groups.length?groups.map(g=>`<div class="row click" data-id="${g.id}"><div class="grow"><b>${esc(g.name)}</b><div class="sub">${g.members.length} member${g.members.length>1?"s":""}</div></div><span class="sub">›</span></div>`).join(""):`<div class="empty">No groups yet. Create one for a trip, a flat, or a dinner.</div>`}</div>`;
  $("#new").onclick=newGroupDialog;
  app.querySelectorAll(".row.click").forEach(r=>r.onclick=()=>{gid=r.dataset.id;route()});
}

function renderGroup(){
  if(!gid)return;
  if(!group)return app.innerHTML=`<div class="empty">Loading group…</div>`;
  const cur=group.currency||"$",b=balances(),mine=b[user.uid]||0,debts=simplify(b);
  app.innerHTML=`<button class="btn sm" id="back">‹ Groups</button>
  <h2>${esc(group.name)}</h2>
  <div class="sub">${mine===0?"You're all settled up":mine>0?`You are owed <b class="get">${money(mine,cur)}</b>`:`You owe <b class="owe">${money(mine,cur)}</b>`}</div>
  <div class="bar"><button class="btn pri" id="add">Add expense</button><button class="btn" id="addf">Add by email</button><button class="btn" id="inv">Invite link</button><button class="btn" id="del">Delete group</button></div>
  <h3>Who owes whom</h3>
  <div class="card">${debts.length?debts.map(d=>`<div class="row">${avatar(group.memberInfo[d.from])}<div class="grow">${esc(firstName(group,d.from))} ${d.from===user.uid?"owe":"owes"} ${esc(firstName(group,d.to)).toLowerCase()==="you"?"you":esc(firstName(group,d.to))}</div><span class="amt ${d.from===user.uid?"owe":d.to===user.uid?"get":""}">${money(d.amount,cur)}</span>${d.from===user.uid||d.to===user.uid?`<button class="btn sm" data-settle="${d.from}|${d.to}|${d.amount}">Settle</button>`:""}</div>`).join(""):`<div class="empty">Nothing to settle.</div>`}</div>
  <h3>Members</h3>
  <div class="card">${group.members.map(m=>`<div class="row">${avatar(group.memberInfo[m])}<div class="grow">${esc(firstName(group,m)==="You"?group.memberInfo[m]?.name+" (you)":group.memberInfo[m]?.name)}<div class="sub">${esc(group.memberInfo[m]?.email||"")}</div></div><span class="amt ${b[m]>0?"get":b[m]<0?"owe":""}">${b[m]>0?"+":b[m]<0?"−":""}${money(b[m]||0,cur)}</span></div>`).join("")}</div>
  <h3>Expenses</h3>
  <div class="card">${expenses.length?expenses.map(e=>expRow(e,cur)).join(""):`<div class="empty">No expenses yet. Add the first one.</div>`}</div>`;
  $("#back").onclick=()=>{gid=null;group=null;expenses=[];route()};
  $("#add").onclick=expenseDialog;$("#addf").onclick=addFriendDialog;$("#inv").onclick=inviteDialog;$("#del").onclick=deleteGroup;
  app.querySelectorAll("[data-settle]").forEach(x=>x.onclick=()=>{const[f,t,a]=x.dataset.settle.split("|");settle(f,t,+a)});
  app.querySelectorAll("[data-rm]").forEach(x=>x.onclick=async()=>{if(confirm("Delete this entry?"))await deleteDoc(doc(db,"groups",gid,"expenses",x.dataset.rm))});
}

function expRow(e,cur){
  const when=(e.createdAt?.toDate?.()||new Date()).toLocaleDateString(undefined,{month:"short",day:"numeric"});
  let main,right;
  if(e.type==="settle"){main=`${esc(firstName(group,e.paidBy))} paid ${esc(firstName(group,e.to))}`;right=`<span class="amt get">${money(e.amount,cur)}</span>`}
  else{
    main=`<b>${esc(e.desc)}</b><div class="sub">${esc(firstName(group,e.paidBy))} paid ${money(e.amount,cur)} · ${e.mode==="amount"?"split by amount":"split equally"} between ${e.split.length} · ${when}</div>`;
    const my=(e.shares||splitEqual(e.amount,e.split))[user.uid]||0;
    const net=(e.paidBy===user.uid?e.amount:0)-my;
    right=net===0?`<span class="sub">not involved</span>`:`<span class="amt ${net>0?"get":"owe"}">${net>0?"you lent ":"you borrowed "}${money(net,cur)}</span>`;
  }
  if(e.type==="settle")main+=`<div class="sub">Settlement · ${when}</div>`;
  return `<div class="row"><div class="grow">${main}</div>${right}${e.by===user.uid?`<button class="btn sm" data-rm="${e.id}" aria-label="Delete">✕</button>`:""}</div>`;
}

function renderSetup(){
  app.innerHTML=`<div class="err"><h2>Connect Firebase</h2>
  <p>Open this file and replace <code>firebaseConfig</code> near the top of the script. Then:</p>
  <ol><li>Firebase console → <b>Authentication</b> → Sign-in method → enable <b>Google</b>.</li>
  <li>Authentication → Settings → <b>Authorized domains</b> → add the domain you host this on (<code>localhost</code> is allowed by default).</li>
  <li>Create a <b>Firestore Database</b> and paste these rules:</li></ol>
  <pre>rules_version = '2';
service cloud.firestore {
  match /databases/{db}/documents {
    match /users/{u} {
      allow read: if request.auth != null;
      allow write: if request.auth != null &amp;&amp; request.auth.uid == u;
    }
    match /groups/{g} {
      allow create: if request.auth != null
        &amp;&amp; request.auth.uid in request.resource.data.members;
      allow read: if request.auth != null;  // group IDs act as private invite codes
      allow update: if request.auth != null;
      allow delete: if request.auth != null
        &amp;&amp; request.auth.uid in resource.data.members;
      match /expenses/{e} {
        allow read, create: if request.auth != null
          &amp;&amp; request.auth.uid in get(/databases/$(db)/documents/groups/$(g)).data.members;
        allow delete: if request.auth != null
          &amp;&amp; request.auth.uid == resource.data.by;
      }
    }
  }
}</pre>
  <p>Serve the file over http(s) (e.g. <code>npx serve</code> or Firebase Hosting); Google sign-in does not work from <code>file://</code>.</p></div>`;
}

/* ---------- dialogs & actions ---------- */
function openDlg(html){dlg.innerHTML=html;dlg.showModal();dlg.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>dlg.close())}

function newGroupDialog(){
  openDlg(`<h2>New group</h2><label>Group name</label><input type="text" id="gn" placeholder="Goa trip" maxlength="60">
  <div class="bar"><button class="btn pri" id="ok">Create group</button><button class="btn" data-close>Cancel</button></div>`);
  $("#ok").onclick=async()=>{
    const name=$("#gn").value.trim();if(!name)return toast("Enter a group name");
    dlg.close();
    try{
      const ref=await addDoc(collection(db,"groups"),{name,members:[user.uid],ownerId:user.uid,createdAt:serverTimestamp(),
        memberInfo:{[user.uid]:{name:user.displayName||user.email,photo:user.photoURL||"",email:user.email||""}}});
      gid=ref.id;route();toast("Group created");
    }catch(e){toast(e.message)}
  };
}

function inviteDialog(){
  const link=location.origin+location.pathname+"?join="+gid;
  openDlg(`<h2>Invite friends</h2><p class="sub">Anyone who opens this link and signs in with Google joins <b>${esc(group?.name||"")}</b>.</p>
  <input type="text" id="lk" readonly value="${esc(link)}">
  <div class="bar"><button class="btn pri" id="cp">Copy link</button><button class="btn" id="sh">Share</button><button class="btn" data-close>Done</button></div>`);
  $("#lk").onfocus=e=>e.target.select();
  $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(link);toast("Link copied")}catch{$("#lk").select();toast("Press copy on your keyboard")}};
  $("#sh").onclick=()=>navigator.share?navigator.share({title:"Join "+group.name+" on Splitly",url:link}).catch(()=>{}):location.href=`mailto:?subject=${encodeURIComponent("Join "+group.name+" on Splitly")}&body=${encodeURIComponent(link)}`;
}

function addFriendDialog(){
  openDlg(`<h2>Add a friend</h2><p class="sub">Search by the email of their Google account. They need to have signed in to Splitly once. If they haven't, send them the invite link.</p>
  <label>Email</label><input type="text" id="fe" placeholder="friend@gmail.com" inputmode="email" autocapitalize="off">
  <div class="bar"><button class="btn pri" id="fs">Search</button><button class="btn" id="fl">Invite link</button><button class="btn" data-close>Done</button></div><div id="fr"></div>`);
  const run=async()=>{
    const em=$("#fe").value.trim().toLowerCase();if(!em.includes("@"))return toast("Enter the full email address");
    const out=$("#fr");out.innerHTML=`<div class="sub">Searching…</div>`;
    try{
      const snap=await getDocs(query(collection(db,"users"),where("emailLower","==",em)));
      if(snap.empty){out.innerHTML=`<div class="empty">No one with that email has signed in yet. Send them the invite link instead.</div>`;return}
      out.innerHTML=`<div class="card">${snap.docs.map(d=>{const u=d.data();return `<div class="row">${avatar(u)}<div class="grow">${esc(u.name)}<div class="sub">${esc(u.email)}</div></div>${group.members.includes(d.id)?`<span class="sub">In group</span>`:`<button class="btn sm pri" data-add="${d.id}">Add</button>`}</div>`}).join("")}</div>`;
      out.querySelectorAll("[data-add]").forEach(b=>b.onclick=async()=>{
        const id=b.dataset.add,u=snap.docs.find(x=>x.id===id).data();b.disabled=true;
        try{
          await updateDoc(doc(db,"groups",gid),{members:arrayUnion(id),["memberInfo."+id]:{name:u.name,photo:u.photo||"",email:u.email||""}});
          b.outerHTML=`<span class="sub">Added</span>`;toast(u.name+" added to the group");
        }catch(e){toast(e.message);b.disabled=false}
      });
    }catch(e){out.innerHTML=`<div class="empty">${esc(e.message)}</div>`}
  };
  $("#fs").onclick=run;$("#fe").onkeydown=e=>{if(e.key==="Enter")run()};
  $("#fl").onclick=inviteDialog;
}

function expenseDialog(){
  const nm=m=>group.memberInfo[m]?.name||"Someone";
  openDlg(`<h2>Add expense</h2><label>Description</label><input type="text" id="ed" placeholder="Dinner" maxlength="80">
  <label>Amount (₹)</label><input type="number" id="ea" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
  <label>Paid by</label><select id="ep">${group.members.map(m=>`<option value="${m}" ${m===user.uid?"selected":""}>${esc(m===user.uid?"You":nm(m))}</option>`).join("")}</select>
  <label>Split</label><select id="em"><option value="equal">Equally</option><option value="amount">By amount</option></select>
  <div id="who2" style="margin-top:6px">${group.members.map(m=>`<label class="chk"><input type="checkbox" class="cb" value="${m}" checked><span class="grow">${esc(nm(m))}</span><input type="number" class="sa" data-u="${m}" inputmode="decimal" step="0.01" min="0" placeholder="0.00" aria-label="Amount for ${esc(nm(m))}"></label>`).join("")}</div>
  <div class="sub" id="left"></div>
  <div class="bar"><button class="btn pri" id="ok">Save expense</button><button class="btn" data-close>Cancel</button></div>`);
  const em=$("#em"),w=$("#who2"),left=$("#left"),cents=v=>Math.round((parseFloat(v)||0)*100);
  const upd=()=>{
    const byAmt=em.value==="amount";w.classList.toggle("byamt",byAmt);
    if(!byAmt){left.textContent="";return}
    const r=cents($("#ea").value)-[...w.querySelectorAll(".sa")].reduce((a,i)=>a+cents(i.value),0);
    left.className="sub "+(r===0&&cents($("#ea").value)>0?"get":r<0?"owe":"");
    left.textContent=r===0&&cents($("#ea").value)>0?"Fully assigned":r>0?money(r)+" left to assign":money(r)+" over the total";
  };
  ["#ea","#em","#who2"].forEach(q=>$(q).addEventListener("input",upd));
  $("#ok").onclick=async()=>{
    const desc=$("#ed").value.trim(),amount=cents($("#ea").value),mode=em.value;
    if(!desc||!(amount>0))return toast("Add a description and an amount");
    let split,shares;
    if(mode==="amount"){
      shares={};w.querySelectorAll(".sa").forEach(i=>{const c=cents(i.value);if(c>0)shares[i.dataset.u]=c});
      const sum=Object.values(shares).reduce((a,b)=>a+b,0);
      if(sum!==amount)return toast(sum<amount?"The amounts add up to less than the total":"The amounts add up to more than the total");
      split=Object.keys(shares);
    }else{
      split=[...w.querySelectorAll(".cb:checked")].map(c=>c.value);
      if(!split.length)return toast("Pick at least one person to split with");
    }
    const data={type:"expense",desc,amount,paidBy:$("#ep").value,split,mode,by:user.uid,createdAt:serverTimestamp()};
    if(shares)data.shares=shares;
    dlg.close();
    try{await addDoc(collection(db,"groups",gid,"expenses"),data);toast("Expense saved")}catch(e){toast(e.message)}
  };
}

async function settle(from,to,amount){
  const cur=group.currency||"$";
  if(!confirm(`Record that ${firstName(group,from)} paid ${firstName(group,to)} ${money(amount,cur)}?`))return;
  await addDoc(collection(db,"groups",gid,"expenses"),{type:"settle",paidBy:from,to,amount,by:user.uid,createdAt:serverTimestamp()});
  toast("Settlement recorded");
}

async function deleteGroup(){
  if(!confirm("Delete this group for everyone? Expense entries will no longer be reachable."))return;
  const id=gid;gid=null;group=null;route();
  try{await deleteDoc(doc(db,"groups",id))}catch(e){toast(e.message)}
}
</script>
